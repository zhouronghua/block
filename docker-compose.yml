services:
  api:
    build:
      context: ./server
    container_name: zrh-asia-api
    restart: unless-stopped
    environment:
      - PORT=3000
      - GITHUB_USER=zhouronghua
      - REPO_CACHE_MINUTES=20
      - TOP_REPO_LIMIT=10
    volumes:
      - ./build:/app/build

  nginx:
    image: nginx:1.27-alpine
    container_name: zrh-asia-nginx
    depends_on:
      - api
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./web:/usr/share/nginx/html:ro
      - ./build/certbot/conf:/etc/letsencrypt
      - ./build/certbot/www:/var/www/certbot
